<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <title>Tiny Coverage Fixture</title>
 </head>
 <body>
  <div class="container-fluid">
   <table class="table table-bordered">
    <tbody>
     <tr>
      <td class="warning">Total</td>
      <td class="warning big">
       <div class="progress">
        <div class="progress-bar bg-warning" role="progressbar" aria-valuenow="0.01" aria-valuemin="0" aria-valuemax="100" style="width: 0.01%">
         <span class="sr-only">0.01% covered (warning)</span>
        </div>
       </div>
      </td>
      <td class="warning small"><div align="right">0.01%</div></td>
      <td class="warning small"><div align="right">1&nbsp;/&nbsp;10000</div></td>
      <td class="warning big">
       <div class="progress">
        <div class="progress-bar bg-warning" role="progressbar" aria-valuenow="0.10" aria-valuemin="0" aria-valuemax="100" style="width: 0.10%">
         <span class="sr-only">0.10% covered (warning)</span>
        </div>
       </div>
      </td>
      <td class="warning small"><div align="right">0.10%</div></td>
      <td class="warning small"><div align="right">1&nbsp;/&nbsp;1000</div></td>
     </tr>
    </tbody>
   </table>
  </div>
 </body>
</html>
